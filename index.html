<!DOCTYPE html>
<html>
<head>
	<title>Simple Quiz I/O</title>
</head>
<body>
	<h1>Simple Quiz</h1>
	<h2>{{.Prompt}}</h2>
	<ul>
		{{range .Options}}
			<li>{{.}}</li>
		{{end}}
	</ul>
	<form method="POST" action="/">
  		<input name="answer" required>
  		<button type="submit">Submit</button>
	</form>

	{{if .Processed}}
		<p>{{.Processed}}</p>
	{{end}}
</body>
</html>
